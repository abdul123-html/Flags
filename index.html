<!DOCTYPE html>
<html>
<head>
<style>
  .flag {
    width: 300px;
    height: 150px;
    border: 1px solid #ccc;
    /* Gradient ka istemal karke teeno rang set kiye gaye hain */
    background: linear-gradient(
      #D90012 33.3%, 
      #0033A0 33.3%, 33.3%, 
      #0033A0 66.6%, 
      #F2A800 66.6%
    );
  }
</style>
</head>
<body>

  <h3>Armenia Flag</h3>
  <div class="flag"></div>
  <br>
  <style>
  .belgium-flag {
    width: 200px;
    height: 180px; /* Belgium ka flag aksar square ke qareeb hota hai */
    border: 1px solid #ccc;
    background: linear-gradient(
      to right, 
      #000000 33.3%, 
      #FFE936 33.3%, 66.6%, 
      #FF0F21 66.6%
    );
  }
</style>
<h3>belgium flag</h3>
<div class="belgium-flag"></div>
<br>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indonesia Flag</title>
    <style>
        /* Flag ka main container */
        .indonesia-flag {
            width: 300px;           /* Flag ki lambayi */
            height: 200px;          /* Flag ki oonchayi (2:3 ratio) */
            border: 1px solid #ddd; /* Safed hisse ko alag dikhane ke liye halka border */
            
            /* Linear Gradient se do rangon ki pattiyan banayi gayi hain */
            background: linear-gradient(
                #FF0000 50%,    /* Upar ka 50% hissa Lal (Red) */
                #FFFFFF 50%     /* Niche ka 50% hissa Safed (White) */
            );
            
            margin: 50px auto;     /* Screen ke beech mein lane ke liye */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Thoda sa shadow behtar look ke liye */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h2>Indonesia Flag</h2>
    <div class="indonesia-flag"></div>

</body>
</html>

</body>
</html>
